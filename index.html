<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>Type Fast Or Die</title>
</head>
<body>
    <div class="Game-Container" id="GameContainer">
        <h1>Type Fast Or Die</h1>
        <p>Type the words as fast as you can before time runs out!</p>
        <div class="game">
            <div class="Pargraphs" id="Paragraphs"></div>
            <div class="word-display" id="wordDisplay">Press start to begin</div>
            <input type="text" id="userInput" placeholder="Type here ..." disabled>
            <button id="startButton">Start Game</button>
            <div class="timer" id="timer">Time: 60s</div>
            <div class="score" id="score">Score: 0</div>
            <button id="resetButton">Reset Game</button>

        </div>
    </div>


</body>
</html>
